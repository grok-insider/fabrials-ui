name: Publish packages
# Runs only for a version tag pushed on purpose (v0.7.1 and so on). Publishing uses
# npm trusted publishing (OIDC): each package on npmjs.com trusts this repository's
# publish.yml, so no npm token is stored anywhere. Provenance comes with it.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run stage:publish
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./packages/ui/package.json').version")"
      - run: npm publish --provenance --access public
        working-directory: packages/ui
      - run: npm publish --provenance --access public
        working-directory: packages/ai-ui
