name: Design system checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: fabrials-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # A public repository runs on GitHub-hosted runners (free, isolated). Never the
    # house's self-hosted runners: a fork's pull request would run code on puck-2.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Packages: types, lint, unit tests, build. Site: types, lint, tests (including the
      # registry --check and the offline license gate).
      - run: bun run check
      - run: bun run build:storybook
      - run: bun run test:visual:container
      - run: bun run --cwd apps/site build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-test-failures
          path: |
            playwright-report/
            test-results/
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.site -t fabrials-ui-site:ci .
